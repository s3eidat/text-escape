<body data-tool="text-escape">
<main class="s3-main">
  <section class="s3-hero">
    <h1>Text Escape</h1>
    <p>Escape or unescape text for JSON, JavaScript, HTML, XML, URLs, SQL, CSV, regex, shell, C, Java and Unicode, live as you type.</p>
  </section>

  <section class="card stack">
    <div class="seg te-modes" id="mode" role="group" aria-label="Format"></div>
    <div class="row between">
      <div class="row">
        <div class="seg" id="dir" role="group" aria-label="Direction">
          <button aria-pressed="true" data-v="esc">Escape</button>
          <button aria-pressed="false" data-v="unesc">Unescape</button>
        </div>
        <button class="btn small" id="swap" title="Use the output as input and flip direction"><svg class="i"><use href="#i-refresh"/></svg>Swap</button>
      </div>
      <div class="row te-opts" id="opts"></div>
    </div>
    <div class="grid-2">
      <label class="field"><span id="inLabel">Text</span>
        <textarea class="textarea" id="input" dir="auto" spellcheck="false" placeholder="Type or paste text"></textarea>
      </label>
      <div class="field te-outf">
        <div class="row between"><span id="outLabel">Escaped</span>
          <div class="row">
            <button class="btn ghost small" id="sample">Sample</button>
            <button class="btn small" id="copy"><svg class="i"><use href="#i-copy"/></svg>Copy</button>
          </div>
        </div>
        <textarea class="textarea" id="output" dir="auto" spellcheck="false" readonly></textarea>
      </div>
    </div>
    <div class="row"><span class="chip" id="status">Waiting for text</span><span class="faint" id="info"></span><span class="faint" id="note"></span></div>
  </section>

  <section class="card stack mt">
    <h2>Escaped in every format <small>click a row to copy</small></h2>
    <div class="tbl-wrap"><table class="tbl te-all" id="all"></table></div>
  </section>
</main>
<script src="app.js"></script>
